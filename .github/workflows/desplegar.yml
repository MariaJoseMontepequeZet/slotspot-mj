name: Desplegar en el servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar-slotspot-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: [self-hosted, slotspot]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Copiar el codigo al servidor
        run: |
          mkdir -p "$HOME/slotspot/slotspot-mj"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.env' --exclude='.venv' --exclude='__pycache__' \
            ./ "$HOME/slotspot/slotspot-mj/"

      - name: Desplegar la API
        run: $HOME/slotspot/desplegar.sh api
