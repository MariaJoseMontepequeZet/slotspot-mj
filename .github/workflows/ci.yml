name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar el codigo con ruff
        run: ruff check .

      - name: Verificar el formato con ruff
        run: ruff format --check .

      - name: Ejecutar las pruebas de la API
        run: pytest

      - name: Verificar la sintaxis de los scripts
        run: |
          for script in db/probar.sh ops/respaldar.sh ops/restaurar.sh ops/tests/probar_respaldos.sh; do
            bash -n "$script"
          done

      - name: Probar el esquema de la base de datos
        run: bash db/probar.sh

      - name: Probar el respaldo y la restauracion
        run: bash ops/tests/probar_respaldos.sh

      - name: Validar el compose de referencia
        env:
          POSTGRES_DB: slotspot
          POSTGRES_USER: slotspot
          POSTGRES_PASSWORD: prueba
          JWT_SECRET: prueba
          ALLOWED_ORIGINS: http://127.0.0.1:8439
        run: docker compose -f ops/docker-compose.yml config --quiet
