name: slotspot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: slotspot-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - slotspot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./slotspot-mj
    container_name: slotspot-api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    environment:
      DATABASE_URL: postgresql://slotspot_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      IP_CLIENTE_CABECERA: ${IP_CLIENTE_CABECERA:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: caddy:2-alpine
    container_name: slotspot-web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    ports:
      # Abierto en todas las interfaces mientras el conector de Cloudflare sea el de otro proyecto.
      # Con el tunel propio (perfil tunel) se cambia a "127.0.0.1:8439:80".
      - "8439:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./slotspot-mj-frontend/public:/srv:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:2025.11.1
    container_name: slotspot-tunel
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNEL_TOKEN:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy

volumes:
  slotspot_db_data:
