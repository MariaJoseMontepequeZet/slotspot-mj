name: slotspot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: slotspot-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - slotspot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./slotspot-mj
    container_name: slotspot-api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: caddy:2-alpine
    container_name: slotspot-web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    ports:
      # Abierto en todas las interfaces: el conector de Cloudflare de otro proyecto entra por la direccion del servidor
      - "8439:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./slotspot-mj-frontend/public:/srv:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  slotspot_db_data:
